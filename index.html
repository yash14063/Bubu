<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Bubu 💕</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffe6ea;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(255, 182, 193, 0.5);
      text-align: center;
      max-width: 400px;
      width: 90%;
      position: relative;
    }

    .character-box {
      width: 160px;
      height: 160px;
      margin: 0 auto 1.5rem auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .character-box svg {
      width: 100%;
      height: 100%;
    }

    h1 {
      color: #ff4d6d;
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
    }

    .btn-container {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 1rem;
      position: relative;
      min-height: 50px;
    }

    button {
      padding: 12px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    #yesBtn {
      background-color: #ff4d6d;
      color: white;
      box-shadow: 0 4px 10px rgba(255, 77, 109, 0.3);
    }

    #yesBtn:hover {
      transform: scale(1.1);
      background-color: #ff2a54;
    }

    #noBtn {
      background-color: #cccccc;
      color: #333;
      position: absolute;
      right: 40px;
    }

    .hidden {
      display: none;
    }

    .celebration {
      font-size: 1.2rem;
      color: #c9184a;
      line-height: 1.6;
    }

    .hearts {
      font-size: 2rem;
      margin-top: 10px;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.1); }
    }
  </style>
</head>
<body>

  <div class="card" id="proposalCard">
    <!-- Cute SVG Bear (No external URLs needed) -->
    <div class="character-box" id="avatarBox">
      <svg viewBox="0 0 200 200" id="bearSvg">
        <!-- Ears -->
        <circle cx="50" cy="50" r="25" fill="#f4a261" />
        <circle cx="50" cy="50" r="14" fill="#e76f51" />
        <circle cx="150" cy="50" r="25" fill="#f4a261" />
        <circle cx="150" cy="50" r="14" fill="#e76f51" />
        <!-- Head -->
        <circle cx="100" cy="100" r="70" fill="#f4a261" />
        <!-- Snout -->
        <ellipse cx="100" cy="115" rx="25" ry="18" fill="#fff" />
        <ellipse cx="100" cy="108" rx="10" ry="7" fill="#2b2d42" />
        <!-- Eyes -->
        <circle cx="75" cy="90" r="8" fill="#2b2d42" />
        <circle cx="125" cy="90" r="8" fill="#2b2d42" />
        <circle cx="77" cy="88" r="3" fill="#fff" />
        <circle cx="127" cy="88" r="3" fill="#fff" />
        <!-- Blush -->
        <ellipse cx="60" cy="105" rx="8" ry="5" fill="#ff85a1" opacity="0.6" />
        <ellipse cx="140" cy="105" rx="8" ry="5" fill="#ff85a1" opacity="0.6" />
        <!-- Heart held -->
        <path d="M100 135 C 80 110, 50 130, 100 170 C 150 130, 120 110, 100 135 Z" fill="#ff4d6d" />
      </svg>
    </div>
    
    <h1 id="question">Bubu, will you be my Forever Valentine? 🥺❤️</h1>
    
    <div class="btn-container" id="btnGroup">
      <button id="yesBtn" onclick="acceptProposal()">YES!</button>
      <button id="noBtn" onmouseover="dodgeNo()" onclick="dodgeNo()">No</button>
    </div>

    <div id="successMessage" class="hidden">
      <div class="celebration">
        YAAAAAY! I knew you'd say yes, Bubu! <br> 
        I love you so so much! 🐻💖🐼
      </div>
      <div class="hearts">💖💕🎉✨🥰</div>
    </div>
  </div>

  <script>
    function dodgeNo() {
      const noBtn = document.getElementById('noBtn');
      const card = document.getElementById('proposalCard');
      
      const cardRect = card.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();
      
      const maxX = cardRect.width - btnRect.width - 20;
      const maxY = cardRect.height - btnRect.height - 20;
      
      const randomX = Math.floor(Math.random() * maxX) - (cardRect.width / 2) + (btnRect.width / 2);
      const randomY = Math.floor(Math.random() * maxY) - (cardRect.height / 2) + (btnRect.height / 2);
      
      noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
    }

    function acceptProposal() {
      document.getElementById('question').classList.add('hidden');
      document.getElementById('btnGroup').classList.add('hidden');
      document.getElementById('successMessage').classList.remove('hidden');
      
      // Transform SVG to Happy Heart-Eyes Bear
      document.getElementById('avatarBox').innerHTML = `
        <svg viewBox="0 0 200 200">
          <circle cx="50" cy="50" r="25" fill="#f4a261" />
          <circle cx="50" cy="50" r="14" fill="#e76f51" />
          <circle cx="150" cy="50" r="25" fill="#f4a261" />
          <circle cx="150" cy="50" r="14" fill="#e76f51" />
          <circle cx="100" cy="100" r="70" fill="#f4a261" />
          <ellipse cx="100" cy="115" rx="25" ry="18" fill="#fff" />
          <ellipse cx="100" cy="108" rx="10" ry="7" fill="#2b2d42" />
          <!-- Heart Eyes -->
          <path d="M75 80 C 65 65, 45 80, 75 100 C 105 80, 85 65, 75 80 Z" fill="#ff4d6d" transform="scale(0.5) translate(75, 70)" />
          <path d="M125 80 C 115 65, 95 80, 125 100 C 155 80, 135 65, 125 80 Z" fill="#ff4d6d" transform="scale(0.5) translate(175, 70)" />
          <!-- Big Smile -->
          <path d="M 85 120 Q 100 135 115 120" stroke="#2b2d42" stroke-width="4" fill="none" stroke-linecap="round" />
          <ellipse cx="55" cy="105" rx="10" ry="6" fill="#ff85a1" opacity="0.8" />
          <ellipse cx="145" cy="105" rx="10" ry="6" fill="#ff85a1" opacity="0.8" />
        </svg>
      `;
    }
  </script>
</body>
</html>
